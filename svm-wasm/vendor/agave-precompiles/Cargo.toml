# Vendored agave-precompiles 4.2.2 for svm-wasm: secp256r1 verified with the pure-Rust p256
# crate instead of OpenSSL (which does not build for wasm64). Benches and dev-deps dropped.
# Originally generated by cargo
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "agave-precompiles"
version = "4.2.2"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Solana precompiled programs."
homepage = "https://anza.xyz/"
documentation = "https://docs.rs/agave-precompiles"
readme = false
license = "Apache-2.0"
repository = "https://github.com/anza-xyz/agave"
resolver = "2"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[features]
agave-unstable-api = []

[lib]
name = "agave_precompiles"
path = "src/lib.rs"

[dependencies.agave-feature-set]
version = "=4.2.2"
features = ["agave-unstable-api"]

[dependencies.bincode]
version = "1.3.3"

[dependencies.bytemuck]
version = "1"
features = ["derive"]

[dependencies.ed25519-dalek]
version = "=1.0.1"

[dependencies.libsecp256k1]
version = "0.7.2"
features = ["std", "static-context", "hmac"]
default-features = false

[dependencies.p256]
version = "0.13"
default-features = false
features = ["ecdsa", "std"]

[dependencies.solana-ed25519-program]
version = "3.0.0"

[dependencies.solana-keccak-hasher]
version = "3.1.0"
features = ["sha3"]

[dependencies.solana-message]
version = ">=4.2.3,<4.5.0"

[dependencies.solana-precompile-error]
version = "3.0.0"

[dependencies.solana-pubkey]
version = ">=4.2.0,<4.3.0"
default-features = false

[dependencies.solana-sdk-ids]
version = "3.1.0"

[dependencies.solana-secp256k1-program]
version = "3.0.1"
features = ["serde"]
